services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: signal_store
      POSTGRES_USER: signal
      POSTGRES_PASSWORD: signal_local_password
    ports:
      - "5432:5432"
    volumes:
      - signal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signal -d signal_store"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  signal_postgres_data:
